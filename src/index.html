<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>X-ML/SLT Studio</title>
        <link href="css/style.css" rel="stylesheet" type="text/css" />
        <script
            type="module"
            src="https://cdn.jsdelivr.net/gh/vanillawc/wc-monaco-editor@1/index.js"
        ></script>
    </head>
    <body>
        <header>
            <div>X-ML/SLT Studio</div>
            <div style="margin-left: auto">
                <button id="loadSample">Load sample</button>
                <button id="transformBtn" class="primary">Transform</button>
                <button id="downloadResult">Download Result</button>
            </div>
        </header>

        <main>
            <div class="panel" id="xmlPanel">
                <header>XML</header>
                <wc-monaco-editor
                    id="xml"
                    config="assets/config.json"
                ></wc-monaco-editor>
                <div class="controls">
                    <label
                        ><input type="checkbox" id="prettyXml" checked />
                        Pretty-print XML result</label
                    >
                </div>
            </div>

            <div class="panel" id="xsltPanel">
                <header>XSLT</header>
                <wc-monaco-editor
                    id="xslt"
                    config="assets/config.json"
                ></wc-monaco-editor>
                <div class="controls">
                    <label
                        >Output mode:
                        <select id="outputMode">
                            <option value="html">html</option>
                            <option value="xml">xml</option>
                            <option value="text">text</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="panel" id="resultPanel">
                <header>Result / Preview</header>
                <div style="display: flex; gap: 8px; padding: 8px">
                    <button id="showIframe">Preview (iframe)</button>
                    <button id="showRaw" class="primary">Show Raw</button>
                    <button id="showXmlTree">Show Formatted XML</button>
                </div>
                <div
                    id="resultContainer"
                    style="flex: 1; overflow: auto; padding: 8px"
                >
                    <div id="iframeWrap" style="display: none; height: 100%">
                        <iframe id="previewFrame" class="preview"></iframe>
                    </div>
                    <pre
                        id="rawOutput"
                        class="output"
                        style="display: none"
                    ></pre>
                    <pre
                        id="xmlOutput"
                        class="output"
                        style="display: none"
                    ></pre>
                </div>
                <div class="controls">
                    <div class="status" id="status">Ready</div>
                </div>
            </div>
        </main>
        <script src="scripts/script.js"></script>
    </body>
</html>
